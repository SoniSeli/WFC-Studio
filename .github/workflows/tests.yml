name: Tests

# Work lands directly on main, so each change is tested once. Docs-only pushes skip the Unity run.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

# A newer push cancels the run it supersedes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-24.04
    steps:
      # The Unity editor image is ~15 GB unpacked; the stock runner doesn't have room for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      # Needs repository secrets UNITY_LICENSE (contents of the .ulf file), UNITY_EMAIL and UNITY_PASSWORD.
      # See https://game.ci/docs/github/activation
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # EditMode tests need no build modules, so use the smaller base image.
          # Keep the version in step with ProjectSettings/ProjectVersion.txt.
          customImage: unityci/editor:ubuntu-6000.3.25f1-base-3
          testMode: editmode
          # Benchmarks run locally on the reference machine; shared runners give noisy timings.
          customParameters: -testCategory "!Performance"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts
